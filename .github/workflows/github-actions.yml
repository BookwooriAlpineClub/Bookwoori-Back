name: bookwoori CI/CD with Docker

on:
  push:
    branches: [ "deploy", "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Make application-prod.yml
        run: |
          cd ./core/src/main/resources
          touch ./application.yml
          echo "${{ secrets.APPLICATION }}" > ./application.yml

      - name: Build with Gradle
        run: |
          cd ./core
          chmod +x ./gradlew
          ./gradlew build -x test

      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Core Server build & push
        uses: docker/build-push-action@v6
        with:
          context: ./core
          file: ./Dockerfile
          platforms: linux/arm64/v8
          push: true
          tags: ${{ secrets.DOCKER_REPO_CORE }}:latest

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          envs: GITHUB_SHA
          script: |
            echo "${{ secrets.DOCKER_COMPOSE }}" | sudo tee ./docker-compose.yml
            sudo docker ps -q | xargs -r sudo docker stop && sudo docker ps -aq | xargs -r sudo docker rm
            sudo docker-compose -f ./docker-compose.yml down --rmi all
            sudo docker pull ${{ secrets.DOCKER_REPO_CORE }}:latest
            sudo docker-compose -f ./docker-compose.yml up -d